<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>げんき Study</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#1d2433;--mu:#5d6679;--ln:#d5d9e1;--ac:#243a6b;--ok:#2f7a4d;--no:#b3261e;--sans:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--ser:'Shippori Mincho','Hiragino Mincho ProN',serif}
@media(prefers-color-scheme:dark){:root{--bg:#141824;--card:#1c2233;--ink:#e8ebf2;--mu:#98a1b5;--ln:#2e3650;--ac:#8fa8e6;--ok:#6cc08a;--no:#ef7a72}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
body.nf rt,.off rt{display:none}rt{font-size:.5em}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--ln);background:var(--card);position:sticky;top:0;z-index:5;gap:8px;flex-wrap:wrap}
header span{display:flex;gap:10px;align-items:center;font-size:14px}
.logo{font:800 24px var(--ser);color:var(--ac);cursor:pointer}
main{max-width:860px;margin:0 auto;padding:20px}
h1,h2{font-family:var(--ser);line-height:1.3}h1{font-size:30px}
h2{font-size:21px;margin-top:30px;border-left:4px solid var(--ac);padding-left:10px}
button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on,button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:16px 18px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.les{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;min-height:110px}
.les:disabled{opacity:.5;cursor:default}
.seal{display:inline-grid;place-items:center;min-width:34px;height:34px;background:#b3261e;color:#fff;border-radius:5px;font:800 18px var(--ser);transform:rotate(-4deg)}
nav{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid var(--ln)}
.jp{font-size:1.25em}.big{font-size:1.4em}.mu,small{color:var(--mu)}
.sp{padding:2px 9px;margin-right:8px}
#ans,#pw{font:inherit;font-size:1.3em;padding:8px 12px;width:100%;border:2px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink)}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ac);text-align:center;color:var(--ac)}
.chip{font-size:1.2em;margin:4px;cursor:grab}.opt{display:block;width:100%;text-align:left;margin:6px 0}
.fb{margin:12px 0;font-weight:700;min-height:1.7em}.ok{color:var(--ok)}.no{color:var(--no)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
// Paste your password hash here (the app shows it on first run). Empty = per-browser password.
const HASH="";
const $=s=>document.querySelector(s),app=$('#app');
let S=JSON.parse(localStorage.g||'{}');S.sc=S.sc||{};S.off=S.off||{};S.furi=S.furi!==false;S.gh=S.gh||{};
let V={l:null,tab:'learn'},Q=null,t0,sha0,tt;
const flash=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(tt);tt=setTimeout(()=>t.className='',2500)};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
/* ---------- GitHub sync (progress.json in your repo) ---------- */
const gu=()=>{const g=S.gh;return g.o&&g.r&&g.t?`https://api.github.com/repos/${g.o}/${g.r}/contents/progress.json`:0};
const hd=()=>({Authorization:'Bearer '+S.gh.t,Accept:'application/vnd.github+json'});
async function pull(){const u=gu();if(!u)return;try{const r=await fetch(u,{headers:hd()});if(r.ok){const j=await r.json();sha0=j.sha;Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))))))}}catch(e){}}
function save(){localStorage.g=JSON.stringify(S);clearTimeout(t0);t0=setTimeout(async()=>{const u=gu();if(!u)return;const{sc,off,furi}=S,b={message:'Update progress',content:btoa(unescape(encodeURIComponent(JSON.stringify({sc,off,furi},null,1))))};if(sha0)b.sha=sha0;try{const r=await fetch(u,{method:'PUT',headers:hd(),body:JSON.stringify(b)}),j=await r.json();if(r.ok){sha0=j.content.sha;flash('Saved to GitHub')}else flash('GitHub: '+j.message)}catch(e){flash('GitHub save failed')}},1500)}
function cfg(){const g=S.gh,o=prompt('GitHub username',g.o||'');if(!o)return;const r=prompt('Repository name',g.r||''),t=prompt('Fine-grained token (Contents: read & write, this repo only). Stored only in this browser.',g.t||'');S.gh={o,r,t};localStorage.g=JSON.stringify(S);pull().then(()=>{save();render()})}
/* ---------- Furigana & speech ---------- */
// [漢字|かんじ] = furigana (tap to hide per kanji). {は|わ} = shown は, spoken わ.
const fu=s=>s.replace(/\[([^|\]]+)\|([^\]]+)\]/g,(m,k,r)=>`<ruby class="k${S.off[k]?' off':''}" data-k="${k}">${k}<rt>${r}</rt></ruby>`).replace(/\{([^|}]+)\|[^}]+\}/g,'$1');
const rd=s=>s.replace(/\[([^|\]]+)\|([^\]]+)\]/g,'$2').replace(/\{[^|}]+\|([^}]+)\}/g,'$1').replace(/<br>|[AB]：|_|\s/g,'');
const jv=()=>speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
function say(t){const vs=jv(),u=new SpeechSynthesisUtterance(rd(t));u.lang='ja-JP';u.voice=vs.find(v=>v.name==S.voice)||vs.find(v=>/Natural|Neural|Online|Premium|Enhanced|Google|Kyoko|O-Ren/i.test(v.name))||vs[0]||null;u.rate=S.rate||.85;if(!vs.length)flash('No Japanese voice found: install one in your device speech settings.');speechSynthesis.cancel();speechSynthesis.speak(u)}
speechSynthesis.onvoiceschanged=()=>{if(V.l!=null&&V.tab=='listen'&&!Q)render()};
const vc=()=>`<div class="card"><p><select onchange="S.voice=this.value;save()" aria-label="Voice">${jv().map(v=>`<option ${v.name==S.voice?'selected':''}>${v.name}</option>`).join('')||'<option>No Japanese voice found</option>'}</select> <label>Speed <input type="range" min=".5" max="1.1" step=".05" value="${S.rate||.85}" onchange="S.rate=+this.value;save()"></label> <button data-s="[学生|がくせい]です。">▶ Test</button></p><p><small>Japanese drops some vowels: <b>がくせい</b> sounds like "gaksei" and <b>です</b> like "des". The browser can't force this, it depends on the voice. If a voice says every vowel, try another one here. Natural/Neural voices (Edge's "Microsoft … Natural", Chrome's Google 日本語, Apple's Enhanced/Premium Kyoko) do it best.</small></p></div>`;
const sp=j=>`<button class="sp" data-s="${j}" aria-label="Play audio">▶</button>`;
/* ---------- Romaji → kana input ---------- */
const M={'-':'ー','.':'。',',':'、',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',xtsu:'っ'};
const R={a:'あいうえお',k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',y:'や_ゆ_よ',r:'らりるれろ',w:'わ___を',g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
for(const c in R)[...R[c]].forEach((k,i)=>k!='_'&&(M[(c=='a'?'':c)+'aiueo'[i]]=k));
[['ky','き'],['gy','ぎ'],['ny','に'],['hy','ひ'],['by','び'],['py','ぴ'],['my','み'],['ry','り'],['sh','し'],['ch','ち'],['j','じ'],['jy','じ']].forEach(([p,k])=>[...'aiueo'].forEach((v,i)=>'aou'.includes(v)&&(M[p+v]=k+'ゃゅょ'['aou'.indexOf(v)])));
function toKana(s,f){s=s.toLowerCase();let o='',i=0;while(i<s.length){const r=s.slice(i);
if(/^([kstpcgzdbhmrfjw])\1/.test(r)){o+='っ';i++;continue}
if(!f&&r=='nn'){o+=r;break}
if(r[0]=='n'&&(r[1]=="'"||(r[1]=='n'&&!/[aiueoy]/.test(r[2]||'')))){o+='ん';i+=2;continue}
if(r[0]=='n'&&r[1]&&!/[aiueoy]/.test(r[1])){o+='ん';i++;continue}
if(r=='n'&&f){o+='ん';i++;continue}
const k=M[r.slice(0,4)]?4:M[r.slice(0,3)]?3:M[r.slice(0,2)]?2:M[r[0]]?1:0;
if(k){o+=M[r.slice(0,k)];i+=k}else{o+=r[0];i++}}return o}
const kt=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)),nz=s=>s.replace(/[\s。、.,!?！？]/g,'');
/* ---------- Course content (original explanations, Genki-style progression) ---------- */
const OUT=["Verbs & particles","Time & existence","Adjectives","て-form","ている & describing","Short forms","Past short forms","Comparisons","Wants & counting","Experiences & reasons","Potential & しか","Requests & ましょう","Giving & receiving","〜てから & causes","Opinions & quoting","Transitive & intransitive","Honorific","Humble","Passive","Causative","Causative-passive"];
const L=[{t:'Introductions: A は B です',
v:[['[私|わたし]','わたし','I / me'],['[学生|がくせい]','がくせい','student'],['[先生|せんせい]','せんせい','teacher'],['[大学|だいがく]','だいがく','university'],['[日本|にほん]','にほん','Japan'],['アメリカ','アメリカ','America'],['[友達|ともだち]','ともだち','friend'],['[本|ほん]','ほん','book'],['[名前|なまえ]','なまえ','name'],['[人|ひと]','ひと','person'],['コーヒー','コーヒー','coffee'],['テレビ','テレビ','television']],
g:[{h:'X は Y です: "X is Y"',b:'<p><b>は</b> marks the topic, what you are talking about. It is written は but pronounced <b>wa</b>. <b>です</b> is the polite "is / am / are" and closes the sentence.</p>',x:[['[私|わたし]{は|わ}[学生|がくせい]です。','I am a student.'],['[田中|たなか]さん{は|わ}[先生|せんせい]です。','Mr./Ms. Tanaka is a teacher.']]},
{h:'Questions with か',b:'<p>Put <b>か</b> at the end to make a yes/no question. No question mark is needed.</p>',x:[['[先生|せんせい]ですか。','Is (he/she) a teacher?'],['はい、[学生|がくせい]です。','Yes, (I) am a student.']]},
{h:'Saying "is not": じゃありません',b:'<p>Replace です with <b>じゃありません</b> for the polite negative.</p>',x:[['[私|わたし]{は|わ}[先生|せんせい]じゃありません。','I am not a teacher.'],['[田中|たなか]さん{は|わ}[学生|がくせい]じゃありません。','Mr./Ms. Tanaka is not a student.']]},
{h:'の and も',b:'<p><b>A の B</b> means B that belongs to or relates to A. <b>も</b> means "also" and takes the place of は.</p>',x:[['[私|わたし]の[本|ほん]です。','It is my book.'],['[大学|だいがく]の[先生|せんせい]です。','(He/She) is a university teacher.'],['[私|わたし]も[学生|がくせい]です。','I am a student too.']]}],
q:[{s:'[私|わたし]{は|わ}[学生|がくせい]___。',a:'です',en:'I am a student.',o:['です','ですか','じゃありません','の']},{s:'[田中|たなか]さん{は|わ}[先生|せんせい]___。',a:'ですか',en:'Is Mr. Tanaka a teacher?',o:['ですか','です','も','の']},{s:'[私|わたし]___[本|ほん]です。',a:'の',en:'It is my book.',o:['の','も','か','は']},{s:'[私|わたし]___[学生|がくせい]です。',a:'も',en:'I am a student too.',o:['も','の','か','じゃ']},{s:'[私|わたし]{は|わ}[先生|せんせい]___。',a:'じゃありません',en:'I am not a teacher.',o:['じゃありません','です','ですか','の']}],
rd:{j:'[私|わたし]{は|わ}[田中|たなか]です。[大学|だいがく]の[学生|がくせい]です。[友達|ともだち]も[学生|がくせい]です。',en:"I'm Tanaka. I'm a university student. My friend is a student too.",q:[{p:'Who is Tanaka?',a:'A university student',o:['A university student','A teacher','A friend','A person from America']},{p:'Is the friend a student?',a:'Yes',o:['Yes','No','A teacher','Not stated']}]}},
{t:'This, that & where: これ・それ・あれ',
v:[['これ','これ','this (near me)'],['それ','それ','that (near you)'],['あれ','あれ','that (over there)'],['[傘|かさ]','かさ','umbrella'],['[時計|とけい]','とけい','watch / clock'],['[鉛筆|えんぴつ]','えんぴつ','pencil'],['[机|つくえ]','つくえ','desk'],['[部屋|へや]','へや','room'],['[駅|えき]','えき','station'],['[車|くるま]','くるま','car'],['[誰|だれ]','だれ','who'],['トイレ','トイレ','restroom']],
g:[{h:'これ・それ・あれ',b:'<p>Pointing words that stand in for a noun. <b>これ</b> is near the speaker, <b>それ</b> is near the listener, <b>あれ</b> is far from both.</p>',x:[['これ{は|わ}[私|わたし]の[本|ほん]です。','This is my book.'],['それ{は|わ}[傘|かさ]ですか。','Is that an umbrella?'],['あれ{は|わ}[駅|えき]です。','That over there is a station.']]},
{h:'この・その・あの + noun',b:'<p>When a noun follows, use <b>この / その / あの</b> directly before it. A trailing <b>の</b> can stand for "mine / the teacher\'s".</p>',x:[['この[時計|とけい]{は|わ}[私|わたし]のです。','This watch is mine.'],['あの[車|くるま]{は|わ}[先生|せんせい]のです。',"That car over there is the teacher's."]]},
{h:'ここ・そこ・あそこ and だれ',b:'<p>Place words follow the same here / there / over there pattern. <b>だれ</b> asks "who"; <b>だれの</b> asks "whose".</p>',x:[['ここ{は|わ}[私|わたし]の[部屋|へや]です。','This is my room.'],['トイレ{は|わ}あそこです。','The restroom is over there.'],['これ{は|わ}[誰|だれ]の[傘|かさ]ですか。','Whose umbrella is this?']]}],
q:[{s:'___{は|わ}[私|わたし]の[本|ほん]です。',a:'これ',en:'This is my book.',o:['これ','それ','あれ','どれ']},{s:'___[車|くるま]{は|わ}[先生|せんせい]のです。',a:'あの',en:"That car over there is the teacher's.",o:['あの','あれ','ここ','これ']},{s:'トイレ{は|わ}___です。',a:'あそこ',en:'The restroom is over there.',o:['あそこ','あれ','あの','それ']},{s:'これ{は|わ}___の[傘|かさ]ですか。',a:'だれ',en:'Whose umbrella is this?',o:['だれ','ここ','それ','これ']}],
rd:{j:'A：これ{は|わ}[誰|だれ]の[傘|かさ]ですか。<br>B：それ{は|わ}[先生|せんせい]のです。<br>A：あの[時計|とけい]も[先生|せんせい]のですか。<br>B：いいえ、あれ{は|わ}[私|わたし]のです。',en:"A: Whose umbrella is this? B: That is the teacher's. A: Is that watch over there the teacher's too? B: No, that one is mine.",q:[{p:'Whose umbrella is it?',a:"The teacher's",o:["The teacher's","B's","A friend's","A student's"]},{p:'Whose watch is over there?',a:"B's own",o:["B's own","The teacher's","A friend's","A's"]}]}}];
/* ---------- Views ---------- */
const bar=()=>`<header><b class="logo" onclick="V={l:null};render()">げんき</b><span><label><input type="checkbox" ${S.furi?'checked':''} onchange="S.furi=this.checked;document.body.classList.toggle('nf',!S.furi);save()"> Furigana</label><button onclick="cfg()">GitHub sync</button><button onclick="sessionStorage.clear();location.reload()">Lock</button></span></header>`;
const shell=h=>bar()+'<main>'+h+'</main>';
const home=()=>`<h1>Lessons</h1><p class="mu">Tap any kanji to hide or show its furigana (it stays that way for that kanji). Lessons 3–23 are outlined and will unlock as they are added.</p><div class="grid">`+Array.from({length:23},(_,i)=>{const d=L[i],n=i+1;return `<button class="les" ${d?`onclick="V={l:${i},tab:'learn'};render()"`:'disabled'}><span class="seal">${n}</span><span>${d?d.t:OUT[i-2]}</span><small>${d?(S.sc[n]!=null?'Best '+S.sc[n]+'%':'Not tested yet'):'Coming next'}</small></button>`}).join('')+'</div>';
const learn=d=>`<section><h2>Vocabulary</h2><div class="card"><table>${d.v.map(([j,r,e])=>`<tr><td>${sp(j)}</td><td class="jp">${fu(j)}</td><td>${r}</td><td>${e}</td></tr>`).join('')}</table></div></section>`+d.g.map((g,i)=>`<section><h2>Grammar ${i+1}: ${g.h}</h2><div class="card">${g.b}${g.x.map(([j,e])=>`<p>${sp(j)}<span class="jp">${fu(j)}</span><br><small>${e}</small></p>`).join('')}</div></section>`).join('');
const listen=d=>`<section><h2>Voice & pronunciation</h2>${vc()}</section><section><h2>Listening: sentences</h2><p class="mu">Audio is spoken from the kana reading, so kanji are never misread and the particle は is voiced as "wa".</p><div class="card">${d.g.flatMap(g=>g.x).map(([j,e])=>`<p>${sp(j)}<span class="jp">${fu(j)}</span><br><small>${e}</small></p>`).join('')}</div></section><section><h2>Listening: dictation</h2><div class="card"><p>Hear a word, then write it in kana.</p><button class="pri" onclick="startQ(${V.l},'listen')">Start dictation</button></div></section>`;
const read=d=>`<section><h2>Reading passage</h2><div class="card"><p class="jp">${sp(d.rd.j)}${fu(d.rd.j)}</p><details><summary>Show English</summary><p>${d.rd.en}</p></details></div></section><section><h2>Comprehension questions</h2><div class="card"><button class="pri" onclick="startQ(${V.l},'read')">Start questions</button></div></section>`;
const test=(d,n)=>`<section><h2>Tests</h2><p class="mu">Best score: ${S.sc[n]!=null?S.sc[n]+'%':'none yet'}. Anything you write is in kana: type romaji and it converts as you type.</p><div class="grid">${[['mix','Mixed test','All question types'],['type','Write the word','English to kana'],['fill','Fill in the blank','Type the answer'],['drop','Fill in the blank','Drag or tap the answer'],['mc','Multiple choice','Word meanings'],['listen','Dictation','Hear it, write it'],['read','Reading questions','Passage comprehension']].map(([m,a,b])=>`<button class="les" onclick="startQ(${n-1},'${m}')"><b>${a}</b><small>${b}</small></button>`).join('')}</div></section>`;
const lesson=()=>{const d=L[V.l],n=V.l+1;return `<button onclick="V={l:null};render()">← All lessons</button><h1><span class="seal">${n}</span> ${d.t}</h1><nav>${[['learn','Learn'],['listen','Listen'],['read','Read'],['test','Test']].map(([k,l])=>`<button class="${V.tab==k?'on':''}" onclick="V.tab='${k}';render()">${l}</button>`).join('')}</nav>`+({learn,listen,read,test})[V.tab](d,n)};
function render(){Q=null;window.scrollTo(0,0);app.innerHTML=shell(V.l==null?home():lesson())}
/* ---------- Quiz engine ---------- */
const sh=a=>[...a].sort(()=>Math.random()-.5);
function bq(d,m){const v=d.v,T=()=>v.map(([j,r,e])=>({k:'type',p:`Write in kana: <b>${e}</b>`,a:r})),
M_=()=>v.map(([j,r,e])=>({k:'mc',p:`What does ${fu(j)} mean?`,a:e,o:sh([e,...sh(v.filter(x=>x[2]!=e)).slice(0,3).map(x=>x[2])])})),
Ls=()=>sh(v).slice(0,6).map(([j,r])=>({k:'listen',p:'Listen, then write what you hear in kana.',a:r,s:r})),
F=()=>d.q.map(x=>({k:'fill',p:x.s,a:x.a,en:x.en})),D=()=>d.q.map(x=>({k:'drop',p:x.s,a:x.a,en:x.en,o:sh(x.o)})),
R_=()=>d.rd.q.map(x=>({k:'mc',p:x.p,a:x.a,o:sh(x.o),ctx:d.rd.j})),o={type:T,mc:M_,listen:Ls,fill:F,drop:D,read:R_};
return sh(m=='mix'?[...sh(T()).slice(0,3),...sh(M_()).slice(0,3),...Ls().slice(0,2),...F().filter((_,i)=>i%2),...D().filter((_,i)=>!(i%2)),...R_()]:o[m]())}
function startQ(i,m){Q={l:i,m,q:bq(L[i],m),i:0,s:0,miss:[]};qn()}
const TY=['type','fill','listen'];
function qn(){const q=Q.q[Q.i];Q.d=0;Q.pick='';Q.kata=/^[ァ-ヶー]/.test(q.a);
let h=`<button onclick="render()">✕ Quit</button><p class="mu">Question ${Q.i+1} of ${Q.q.length}</p><div class="card">`;
if(q.ctx)h+=`<p class="jp">${fu(q.ctx)}</p><hr>`;
if(q.k=='listen')h+=`<p>${q.p}</p><button class="pri" data-s="${q.s}">▶ Play again</button>`;
else if(q.k=='fill'||q.k=='drop')h+=`<p class="jp big">${fu(q.p).replace('___','<span class="blank" id="bl"></span>')}</p><small>${q.en}</small>`;
else h+=`<p class="big">${q.p}</p>`;
if(q.k=='drop')h+=`<p>${q.o.map(v=>`<button class="chip" draggable="true" data-v="${v}">${v}</button>`).join('')}</p><p><small>Drag a word into the blank, or tap it.</small></p>`;
if(q.k=='mc')h+=q.o.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('');
if(TY.includes(q.k))h+=`<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${Q.kata?'type romaji → カタカナ':'type romaji → ひらがな'}">`;
h+=`<div id="pv" class="mu"></div></div><div class="fb" id="fb"></div>`+(q.k=='mc'?'':`<button class="pri" id="chk" onclick="ck()">Check</button>`);
app.innerHTML=shell(h);if($('#ans'))$('#ans').focus();if(q.k=='listen')setTimeout(()=>say(q.s),250)}
function ck(v){if(Q.d)return;const q=Q.q[Q.i];let g,ok;
if(TY.includes(q.k)){g=toKana($('#ans').value,1);if(Q.kata)g=kt(g);$('#ans').value=g;$('#pv').textContent='';ok=nz(g)==nz(q.a)}else{g=v!==undefined?v:Q.pick;if(!g)return;ok=g==q.a}
Q.d=1;if(ok)Q.s++;else Q.miss.push(q.a);
$('#fb').innerHTML=ok?'<span class="ok">✓ Correct</span>':`<span class="no">✗ Answer: ${q.a}</span>`+(g?` <small>(you wrote: ${g})</small>`:'');
if($('#chk'))$('#chk').remove();$('#fb').insertAdjacentHTML('afterend',`<button class="pri" onclick="nx()">${Q.i+1<Q.q.length?'Next':'Finish'}</button>`)}
function nx(){Q.i++;Q.i<Q.q.length?qn():fin()}
function fin(){const p=Math.round(Q.s/Q.q.length*100),n=Q.l+1;S.sc[n]=Math.max(S.sc[n]||0,p);save();app.innerHTML=shell(`<div class="card"><h1>${p}%</h1><p>${Q.s} of ${Q.q.length} correct.</p>${Q.miss.length?`<p>Review: <span class="jp">${[...new Set(Q.miss)].join('、')}</span></p>`:''}<button class="pri" onclick="startQ(${Q.l},'${Q.m}')">Try again</button> <button onclick="V={l:${Q.l},tab:'test'};render()">Back to tests</button></div>`);Q=null}
const put=v=>{if(Q&&!Q.d&&$('#bl')){Q.pick=v;$('#bl').textContent=v}};
/* ---------- Events ---------- */
document.addEventListener('click',e=>{const t=e.target,k=t.closest('.k');
if(k){const c=k.dataset.k;S.off[c]=!S.off[c];document.querySelectorAll('.k').forEach(x=>x.dataset.k==c&&x.classList.toggle('off',!!S.off[c]));return save()}
const s=t.closest('[data-s]');if(s)return say(s.dataset.s);
const c=t.closest('.chip');if(c)return put(c.dataset.v);
const o=t.closest('.opt');if(o)ck(o.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id!='ans')return;let x=toKana(e.target.value);if(Q&&Q.kata)x=kt(x);e.target.value=x;let y=toKana(x,1);if(Q&&Q.kata)y=kt(y);$('#pv').textContent=y!=x?'→ '+y:''});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||!Q)return;if(Q.d)nx();else if(e.target.id=='ans')ck()});
document.addEventListener('dragstart',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v)e.dataTransfer.setData('text/plain',v)});
document.addEventListener('dragover',e=>{if(e.target.id=='bl')e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.id=='bl'){e.preventDefault();put(e.dataTransfer.getData('text/plain'))}});
/* ---------- Password gate ---------- */
function gate(){const h=HASH||localStorage.ph;app.innerHTML=`<div class="card" style="max-width:380px;margin:14vh auto"><h1>げんき</h1><p class="mu">${h?'Enter your password':'First visit: choose a password (6+ characters)'}</p><input id="pw" type="password" autocomplete="current-password"><p><button class="pri" id="go">${h?'Unlock':'Set password'}</button></p><p id="msg" class="no"></p></div>`;
const go=async()=>{const v=$('#pw').value,x=await sha(v);if(h){if(x!=h)return $('#msg').textContent='Wrong password.'}else{if(v.length<6)return $('#msg').textContent='Use at least 6 characters.';localStorage.ph=x;prompt('Copy this into HASH near the top of index.html and commit it, so every device uses this password:',x)}sessionStorage.ok=1;start()};
$('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key=='Enter')go()})}
async function start(){await pull();document.body.classList.toggle('nf',!S.furi);render()}
if(sessionStorage.ok)start();else gate();
</script></body></html>
