g:[{h:'これ・それ・あれ',b:'<p>Pointing words that stand in for a noun. <b>これ</b> is near the speaker, <b>それ</b> is near the listener, <b>あれ</b> is far from both.</p>',x:[['これ{は|わ}[私|わたし]の[本|ほん]です。','This is my book.'],['それ{は|わ}[傘|かさ]ですか。','Is that an umbrella?'],['あれ{は|わ}[駅|えき]です。','That over there is a station.']]},

const GX={
8:[['Short Forms','The plain forms of verbs and adjectives. Verbs: dictionary form (食べる), negative ない (食べない). です becomes だ.','[私|わたし]{は|わ}[毎日|まいにち][食|た]べる。','I eat every day.'],
['Short Forms in Informal Speech','With friends, end sentences in short form. Questions drop か and rise in tone; は and だ are often dropped.','[明日|あした][行|い]く？','Going tomorrow?'],
['Short Forms in Quoted Speech: 〜と思います','Short form + と思います = "I think that . . .".','[田中|たなか]さん{は|わ}[来|こ]ないと[思|おも]います。','I think Tanaka will not come.'],
['Short Forms in Quoted Speech: 〜と言っていました','Short form + と言っていました reports what someone said.','[先生|せんせい]{は|わ}[明日|あした][来|こ]ないと[言|い]っていました。','The teacher said (he/she) will not come tomorrow.'],

['Verb のが好きです / 上手です','Short form + の turns a verb into a noun ("doing X"), followed by が好き or が上手.','[私|わたし]{は|わ}[歌|うた]うのが[好|す]きです。','I like singing.'],
['The Subject Particle が','が marks the subject, especially when it is new information or the answer to "who / which".','[誰|だれ]が[来|き]ましたか。','Who came?'],
['何か and 何も','何か = "something / anything"; 何も + negative = "nothing at all".','[何|なに]も[食|た]べません。','I do not eat anything.']],
9:[['Past Tense Short Forms','Verbs: た-form. い-adj: 〜かった. Noun / な-adj: だった. Negative: 〜なかった.','[昨日|きのう][映画|えいが]を[見|み]た。','I watched a movie yesterday.'],
['Past Tense Short Forms in Informal Speech','Questions drop か and rise in tone.','[昨日|きのう]、[映画|えいが]を[見|み]た？','Did you watch a movie yesterday?'],
['Past Tense Short Forms in Quoted Speech: 〜と思います','Past short form + と思います = "I think that . . . (did)".','[昨日|きのう]、[雨|あめ]が[降|ふ]ったと[思|おも]います。','I think it rained yesterday.'],
['Past Tense Short Forms in Quoted Speech: 〜と言っていました','Past short form + と言っていました reports what someone said.','[友達|ともだち]{は|わ}[昨日|きのう][来|こ]なかったと[言|い]っていました。','My friend said (he/she) did not come yesterday.'],
['Qualifying Nouns with Verbs and Adjectives','A short-form clause placed directly before a noun describes it. A subject inside the clause takes が.','[昨日|きのう][見|み]た[映画|えいが]{は|わ}おもしろかったです。','The movie I watched yesterday was interesting.'],
['もう〜ました and まだ〜ていません','もう + past = "already"; まだ + 〜ていません = "not yet".','もう[昼|ひる]ご[飯|はん]を[食|た]べました。','I already ate lunch.'],
['Explanation から, Situation','Reason + から = "because . . .". The から clause can also come second.','[雨|あめ]だから、[行|い]きません。','I will not go because it is raining.']],
10:[['Comparison between Two Items','A は B より adjective = "A is more . . . than B".','[電車|でんしゃ]{は|わ}[車|くるま]より[速|はや]いです。','Trains are faster than cars.'],
['Comparison among Three or More Items','Category の中で X が一番 adjective = "X is the most . . . in the category".','[果物|くだもの]の[中|なか]で[何|なに]が[一番|いちばん][好|す]きですか。','Among fruits, what do you like best?'],
['Adjective/Noun + の','の stands in for a noun already mentioned: "the . . . one".','[赤|あか]いのがいいです。','The red one is good.'],
['〜つもりだ','Dictionary form + つもりです = "I intend to . . .". Negative: ない + つもりです.','[来年|らいねん][日本|にほん]に[行|い]くつもりです。','I plan to go to Japan next year.'],
['Adjective + なる','い-adj: 〜くなる. な-adj / noun: 〜になる. Means "become . . .".','[寒|さむ]くなりました。','It has become cold.'],
['どこかに / どこにも','どこかに = "somewhere"; どこにも + negative = "nowhere".','[冬休み|ふゆやすみ]にどこにも[行|い]きませんでした。','I did not go anywhere over winter break.'],
['で','で also marks the means or tool used to do something.','[電車|でんしゃ]で[行|い]きます。','I go by train.']],
11:[['〜たい','Verb stem + たい = "want to . . .". It conjugates like an い-adjective.','[日本|にほん]に[行|い]きたいです。','I want to go to Japan.'],
['〜たり〜たりする','Lists sample actions: "do things like A and B".','[本|ほん]を[読|よ]んだり、[音楽|おんがく]を[聞|き]いたりします。','I do things like read books and listen to music.'],
['〜ことがある','Past short form + ことがあります = "I have done . . . before".','[日本|にほん]に[行|い]ったことがあります。','I have been to Japan.'],
['Noun A や Noun B','や lists examples: "A and B, among other things".','[机|つくえ]の[上|うえ]に[本|ほん]や[時計|とけい]があります。','On the desk there are things like a book and a watch.']],
12:[['〜んです','Short form + んです explains a situation or asks for an explanation.','どうしたんですか。','What happened?'],
['〜すぎる','Verb stem (or adjective without い / な) + すぎる = "too much".','[食|た]べすぎました。','I ate too much.'],
['〜ほうがいいです','Past short + ほうがいいです = "you had better . . .". For "had better not", use ない + ほうがいいです.','[早|はや]く[寝|ね]たほうがいいです。','You had better go to bed early.'],
['〜ので','Short form + ので = "because . . .", softer than から.','[頭|あたま]が[痛|いた]いので、[休|やす]みます。','I have a headache, so I will rest.'],
['〜なければいけません / 〜なきゃいけません','ない-form without い + ければいけません = "must . . .". Casual: なきゃ.','[勉強|べんきょう]しなければいけません。','I must study.'],
['〜でしょうか','A polite, tentative "I wonder if . . .".','これでいいでしょうか。','Is this all right?']],
13:[['Potential Verbs','Can do. る-verbs: stem + られる (食べられる). う-verbs: final sound to the え-row + る (書く → 書ける, 読む → 読める). する → できる, 来る → こられる. The object usually takes が.','[私|わたし]{は|わ}[日本語|にほんご]が[話|はな]せます。','I can speak Japanese.'],
['〜し','Short form + し lists reasons or facts, often with も. It suggests there are more reasons.','この[店|みせ]{は|わ}[安|やす]いし、おいしいです。','This shop is cheap, and it is delicious too.'],
['〜そうです (It looks like . . .)','い-adjective stem or verb ます-stem + そう = "looks like / seems about to". いい → よさそう, ない → なさそう.','このケーキ{は|わ}おいしそうです。','This cake looks delicious.'],
['〜てみる','て-form + みる = "try doing it and see".','[日本|にほん]の[料理|りょうり]を[食|た]べてみます。','I will try eating Japanese food.'],
['なら','Noun or short form + なら = "if that is the case". It responds to a topic the other person just raised.','[京都|きょうと]に[行|い]くなら、[春|はる]がいいですよ。','If you are going to Kyoto, spring is good.'],
['一週間に三回 (frequency per time period)','Time period + に + number + 回 tells how often something happens.','[一週間|いっしゅうかん]に[三回|さんかい][泳|およ]ぎます。','I swim three times a week.']],
14:[['ほしい','ほしい = "want (a thing)". The thing takes が. For another person, use ほしがっている.','[新|あたら]しいかばんがほしいです。','I want a new bag.'],
['〜かもしれません','Short form + かもしれません = "might / maybe".','[明日|あした][雨|あめ]が[降|ふ]るかもしれません。','It might rain tomorrow.'],
['あげる / くれる / もらう','あげる: giving to someone else. くれる: someone gives to me (or my side). もらう: receiving from someone.','[友達|ともだち]{は|わ}[私|わたし]に[本|ほん]をくれました。','My friend gave me a book.'],
['〜たらどうですか','た-form + らどうですか = "How about doing . . . ? / Why not . . . ?" for suggestions.','[医者|いしゃ]に[行|い]ったらどうですか。','Why not go and see a doctor?'],
['Number + も / Number + しか + Negative','Number + も stresses a large amount ("as many as"). Number + しか + negative stresses a small amount ("only").','[本|ほん]を[十冊|じっさつ]も[買|か]いました。','I bought as many as ten books.']],
15:[['Volitional Form','The "let us / I will" form. る-verbs: stem + よう (食べよう). う-verbs: final sound to the お-row + う (行く → 行こう, 読む → 読もう). する → しよう, 来る → こよう.','[一緒|いっしょ]に[行|い]こう。','Let us go together.'],
['Volitional Form + と思っています','Volitional form + と思っている = "I am thinking of doing . . .". It shows a plan not yet fixed.','[来年|らいねん]、[日本|にほん]に[行|い]こうと[思|おも]っています。','I am thinking of going to Japan next year.'],
['〜ておく','て-form + おく = do something in advance, or leave something as it is.','[旅行|りょこう]の[前|まえ]に、ホテルを[予約|よやく]しておきます。','I will book a hotel before the trip.'],
['Using Sentences to Qualify Nouns','A short-form clause placed before a noun describes it, like "that / which / who" in English. The clause subject can use が or の.','[私|わたし]が[昨日|きのう][見|み]た[映画|えいが]{は|わ}おもしろかったです。','The movie I saw yesterday was interesting.']],
16:[['〜てあげる / くれる / もらう','Favors: Vてあげる (I do it for someone), Vてくれる (someone does it for me), Vてもらう (I get someone to do it).','[友達|ともだち]が[宿題|しゅくだい]を[手伝|てつだ]ってくれました。','My friend helped me with my homework.'],
['〜ていただけませんか','A very polite request: て-form + いただけませんか = "Could you please . . . ?".','ここに[名前|なまえ]を[書|か]いていただけませんか。','Could you please write your name here?'],
['〜といい','Short form + といいです = "it would be good if / I hope that . . .".','[早|はや]く[元気|げんき]になるといいですね。','I hope you get well soon.'],
['〜時','Short form + 時 = "when . . .". A present form describes an ongoing or upcoming time, a past form a completed one.','[日本|にほん]に[行|い]った[時|とき]、[京都|きょうと]を[見|み]ました。','When I went to Japan, I saw Kyoto.'],
['〜てすみませんでした','て-form + すみませんでした apologizes for trouble you caused. てくれてありがとう thanks someone for a favor.','[遅|おそ]くなってすみませんでした。','I am sorry I was late.']],
17:[['〜そうです (I hear . . .)','Short form + そうです reports hearsay: "I heard that . . .". Do not confuse it with the "looks like" そう.','[田中|たなか]さん{は|わ}[来週|らいしゅう][日本|にほん]に[行|い]くそうです。','I heard Tanaka is going to Japan next week.'],
['〜って','A casual form of the quoting と, and a casual topic marker meaning "as for / called".','[明日|あした][来|こ]ないって[言|い]っていたよ。','He or she said (they) are not coming tomorrow.'],
['〜たら','た-form + ら = "if / when (after)". The second half can be a request, a wish or a fact.','[雨|あめ]が[降|ふ]ったら、[行|い]きません。','If it rains, I will not go.'],
['〜なくてもいいです','Negative stem なくて + もいいです = "you do not have to . . .".','[明日|あした]{は|わ}[来|こ]なくてもいいです。','You do not have to come tomorrow.'],
['〜みたいです','Noun or short form + みたいです = "it seems / looks like", judging from what you see or hear.','[彼|かれ]{は|わ}[疲|つか]れているみたいです。','He seems to be tired.'],
['〜前に / 〜てから','Dictionary form + 前に = "before doing". て-form + から = "after doing".','[寝|ね]る[前|まえ]に、[歯|は]を[磨|みが]きます。','I brush my teeth before sleeping.']],
18:[['Transitivity Pairs','Many verbs come in pairs. The transitive one (someone does it, takes を) and the intransitive one (it happens, takes が): 開ける / 開く, 閉める / 閉まる, つける / つく.','[窓|まど]を[開|あ]けます。','I open the window.'],
['Paired Intransitive Verbs + ている','Intransitive verb + ている describes the state that results after a change.','[窓|まど]が[開|あ]いています。','The window is open.'],
['〜てしまう','て-form + しまう = "finish completely", or "end up doing" something regrettable.','[財布|さいふ]を[忘|わす]れてしまいました。','I ended up forgetting my wallet.'],
['〜と','Dictionary form + と = "when / if . . . (then naturally)". Used for facts, habits and directions.','このボタンを[押|お]すと、ドアが[開|あ]きます。','If you press this button, the door opens.'],
['〜ながら','ます-stem + ながら = doing two actions at the same time.','[音楽|おんがく]を[聞|き]きながら[勉強|べんきょう]します。','I study while listening to music.'],
['〜ばよかったです','ば-form + よかったです = "I should have . . .". る-verbs: 食べれば; う-verbs: final sound to the え-row + ば (行く → 行けば); する → すれば.','もっと[勉強|べんきょう]すればよかったです。','I should have studied more.']]};

(()=>{const keep=(i,hs)=>{L[i].g=hs.map(t=>L[i].g.find(x=>x.h==t))};keep(0,["Greetings and set phrases","Numbers 0–100","X は Y です: \"X is Y\"","Questions with か","Saying \"is not\": じゃありません","の and も","Names and さん","Countries and nationalities","Asking \"what\": 何","Telling the time & phone numbers"]);keep(1,["これ・それ・あれ","この・その・あの + noun","ここ・そこ・あそこ and だれ","どれ・どの・どこ: question words","と: joining nouns","Prices: いくら & numbers over 100","Days of the week","Negative nouns: じゃないです","も (also) and ね / よ"]);L[5].g.push(...[{"h":"Casual requests: て on its own","b":"<p>Among friends you can drop <b>ください</b>: the plain て-form alone is a casual \"please do it\". Keep ください for teachers and people you do not know well.</p>","x":[["ちょっと[待|ま]って。","Wait a sec."],["[本|ほん]を[読|よ]んで。","Read the book, please."]]},{"h":"Not allowed: 〜てはいけません","b":"<p>て-form + <b>はいけません</b> says something is not allowed. It is the opposite of 〜てもいいです.</p>","x":[["ここで[食|た]べてはいけません。","You must not eat here."],["ここで[話|はな]してはいけません。","You must not talk here."]]},{"h":"Offers and suggestions: 〜ましょうか","b":"<p>Take the verb stem (the ます-form without ます) and add <b>ましょうか</b>: \"Shall I...?\" when you offer to do something, \"Shall we...?\" when you suggest doing it together. A polite yes is <b>はい、おねがいします</b>.</p>","x":[["ここで[待|ま]ちましょうか。","Shall we wait here?"],["[音楽|おんがく]を[聞|き]きましょうか。","Shall we listen to music?"],["はい、おねがいします。","Yes, please."]]}]);L[5].q.push(...[{"s":"ここで[食|た]べては___。","a":"いけません","en":"You must not eat here.","o":["いけません","いいです","ください","ですか"]},{"s":"ここで[待|ま]ち___。","a":"ましょうか","en":"Shall we wait here?","o":["ましょうか","ますか","ください","てもいいですか"]}])})();
/* ---------- Views ---------- */
const bar=()=>`<header><b class="logo" onclick="V={l:null};render()">げんき</b><span><label><input type="checkbox" ${S.furi?'checked':''} onchange="S.furi=this.checked;document.body.classList.toggle('nf',!S.furi);save()"> Furigana</label><button onclick="cfg()">GitHub sync</button><button onclick="sessionStorage.clear();location.reload()">Lock</button></span></header>`;
const shell=h=>bar()+'<main>'+h+'</main>';
const home=()=>`<h1>Lessons</h1><p class="mu">Tap any kanji to hide or show its furigana (it stays that way for that kanji). Every lesson has its full vocabulary list. Grammar explanations are written for Lessons 1–18; Lessons 19–23 list every grammar section, with explanations on the way.</p><div class="grid">`+Array.from({length:23},(_,i)=>{const d=L[i],n=i+1;return `<button class="les" ${d?`onclick="V={l:${i},tab:'learn'};render()"`:'disabled'}><span class="seal">${n}</span><span>${d?d.t:OUT[i-2]}</span><small>${d?(S.sc[n]!=null?'Best '+S.sc[n]+'%':'Not tested yet'):'Coming next'}</small></button>`}).join('')+'</div>';
const vt=a=>`<div class="card"><table>${a.map(([j,r,e,p])=>`<tr><td>${sp(j)}</td><td class="jp">${fu(j)}</td><td>${e}</td><td><small>${p||''}</small></td></tr>`).join('')}</table></div>`;
const tk=s=>[...s.matchAll(/\[([^|\]]+)\|/g)].map(m=>m[1]);let FIRST=null;
function extra(d,n){if(!VX)return[];if(!FIRST){FIRST={};for(let l=1;l<=23;l++)for(const g of['g','m','r','e'])for(const e of(VX[l]||{})[g]||[])for(const k of tk(e[0]))if(!FIRST[k])FIRST[k]=[l,e]}
const t=[];d.g.forEach(g=>g.x.forEach(x=>t.push(x[0])));d.q.forEach(q=>t.push(q.s));if(d.rd)t.push(d.rd.j);const seen=new Set(),o=[];
t.forEach(s=>tk(s).forEach(k=>{const f=FIRST[k];if(f&&f[0]>n&&!seen.has(k)&&!/^[一二三四五六七八九十百千万]+$/.test(k)){seen.add(k);o.push([f[1][0],f[1][1],f[1][2],'Lesson '+f[0]])}}));return o}
const learn=(d,n)=>{const X=VX&&VX[n],EX=extra(d,n),G=[['g','Greetings (あいさつ)'],['m','Vocabulary'],['r','Reading & Writing vocabulary'],['e','Lesson column words'],['x','Extra words used in this lesson\'s examples (taught later in the book)']].filter(([k])=>k=='x'?EX.length:X?X[k]&&X[k].length:k=='m'),
gr=d.g.length?d.g.map((g,i)=>`<section id="s-g${i}"><h2>Grammar ${i+1}: ${g.h}</h2><div class="card">${g.b}${g.x.map(([j,e])=>`<p>${sp(j)}<span class="jp">${fu(j)}</span><br><small>${e}</small></p>`).join('')}</div></section>`).join(''):'<section id="s-g0"><h2>Grammar</h2><div class="card"><p class="mu">Grammar sections for this lesson are being added.</p></div></section>';
return `<p class="sub">Jump to: ${G.map(([k,h])=>`<a href="#s-${k}">${h}</a>`).join(' · ')} · <a href="#s-g0">Grammar</a></p>`+G.map(([k,h])=>{const a=k=='x'?EX:[...(X?X[k]:d.v),...(k=='m'?S.my[n]||[]:[])];return `<section id="s-${k}"><h2>${h} <small>(${a.length})</small></h2>${vt(a)}</section>`}).join('')+gr+mine(n)};
const mine=n=>`<section><h2>My words</h2><div class="card"><p class="mu">Add your own list, one word per line: <b>word, reading, meaning</b> (for example <b>学生, がくせい, student</b>). Your words join this lesson's vocabulary table, tests and dictation, and sync with GitHub.</p><textarea id="mw" rows="6" aria-label="My words" style="width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:8px">${(S.my[n]||[]).map(r=>[r[0].replace(/^\[(.*)\|.*\]$/,'$1'),r[1],r[2]].join(', ')).join('\n')}</textarea><p><button class="pri" onclick="saveMy(${n})">Save my words</button></p></div></section>`;
function saveMy(n){S.my[n]=$('#mw').value.split('\n').map(l=>l.split(/[,\t，、]/).map(x=>x.trim())).filter(r=>r.length>=3&&r[0]).map(r=>[/[一-龯]/.test(r[0])?`[${r[0]}|${r[1]}]`:r[0],r[1],r.slice(2).join(', ')]);save();flash(S.my[n].length+' words saved');render()}
const listen=d=>`<section><h2>Voice & pronunciation</h2>${vc()}</section><section><h2>Listening: sentences</h2><p class="mu">Audio is spoken from the kana reading, so kanji are never misread and the particle は is voiced as "wa".</p><div class="card">${d.g.flatMap(g=>g.x).map(([j,e])=>`<p>${sp(j)}<span class="jp">${fu(j)}</span><br><small>${e}</small></p>`).join('')}</div></section><section><h2>Listening: dictation</h2><div class="card"><p>Hear a word, then write it in kana.</p><button class="pri" onclick="startQ(${V.l},'listen')">Start dictation</button></div></section>`;
const read=d=>!d.rd?'<section><h2>Reading passage</h2><div class="card"><p class="mu">Reading passages for this lesson are being added.</p></div></section>':`<section><h2>Reading passage</h2><div class="card"><p class="jp">${sp(d.rd.j)}${fu(d.rd.j)}</p><details><summary>Show English</summary><p>${d.rd.en}</p></details></div></section><section><h2>Comprehension questions</h2><div class="card"><button class="pri" onclick="startQ(${V.l},'read')">Start questions</button></div></section>`;
const test=(d,n)=>{const all=pool(d,n),k=all.filter(w=>on(n,w)).length,gl={g:'Greetings',m:'Vocabulary',r:'Reading & Writing',e:'Column words'},gs=VX&&VX[n]?Object.keys(gl).filter(g=>VX[n][g]&&VX[n][g].length):[],inp='style="font:inherit;padding:6px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px"';
return `<section><h2>Test settings</h2><div class="card"><p><b id="wc">${k} of ${all.length}</b> words selected. Word tests ask each selected word once, so more words make a longer test.</p><p><button data-sel="all">Select all</button> <button data-sel="none">Select none</button> ${gs.map(g=>`<button data-sel="${g}">Only ${gl[g]}</button>`).join(' ')}</p><p><label>Max questions per test (blank = no limit) <input type="number" min="1" id="cap" value="${S.cap||''}" style="width:90px" ${inp}></label></p><details><summary>Choose words</summary><p><input id="wf" placeholder="Filter words..." style="width:100%" ${inp}></p><div id="wl" style="max-height:340px;overflow:auto">${all.map(w=>`<label style="display:flex;gap:8px;align-items:baseline;padding:3px 0"><input type="checkbox" class="wk" data-k="${esc(wk(w))}" ${on(n,w)?'checked':''}><span class="jp">${fu(w[0])}</span><small>${esc(w[2])}</small></label>`).join('')}</div></details></div></section><section><h2>Tests</h2><p class="mu">Best score: ${S.sc[n]!=null?S.sc[n]+'%':'none yet'}. Anything you write is in kana: type romaji and it converts as you type.</p><div class="grid">${[['mix','Mixed test','Each selected word in a random format, plus grammar'],['type','Write the word','English to kana'],['fill','Fill in the blank','Type the answer'],['drop','Fill in the blank','Drag or tap the answer'],['mc','Multiple choice','Word meanings'],['listen','Dictation','Hear it, write it'],['read','Reading questions','Passage comprehension']].map(([m,a,b])=>`<button class="les" onclick="startQ(${n-1},'${m}')"><b>${a}</b><small>${b}</small></button>`).join('')}</div></section>`};
const lesson=()=>{const d=L[V.l],n=V.l+1;return `<button onclick="V={l:null};render()">← All lessons</button><h1><span class="seal">${n}</span> ${d.t}</h1><nav>${[['learn','Learn'],['listen','Listen'],['read','Read'],['test','Test']].map(([k,l])=>`<button class="${V.tab==k?'on':''}" onclick="V.tab='${k}';render()">${l}</button>`).join('')}</nav>`+({learn,listen,read,test})[V.tab](d,n)};
function render(){Q=null;window.scrollTo(0,0);app.innerHTML=shell(V.l==null?home():lesson())}
/* ---------- Quiz engine ---------- */
const sh=a=>[...a].sort(()=>Math.random()-.5);
const pool=(d,n)=>[...(VX&&VX[n]?[...new Map(['g','m','r','e'].flatMap(k=>VX[n][k]).map(e=>[e[0]+e[2],e])).values()]:d.v),...(S.my[n]||[])];
const wk=w=>w[1]+'|'+w[2],on=(n,w)=>!(S.dis[n]||[]).includes(wk(w)),esc=x=>x.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'),grp=(n,w)=>VX&&VX[n]?['g','m','r','e'].filter(g=>VX[n][g].some(e=>e[0]+e[2]==w[0]+w[2])):[];
function wc(){const n=V.l+1,a=pool(L[V.l],n);if($('#wc'))$('#wc').textContent=a.filter(w=>on(n,w)).length+' of '+a.length}
function sel(g){const n=V.l+1;S.dis[n]=pool(L[V.l],n).filter(w=>g=='all'?0:g=='none'?1:!grp(n,w).includes(g)).map(wk);document.querySelectorAll('.wk').forEach(c=>c.checked=!S.dis[n].includes(c.dataset.k));save();wc()}
document.addEventListener('change',e=>{const t=e.target;if(t.id=='cap'){S.cap=Math.max(0,+t.value||0);save();return}if(!t.classList||!t.classList.contains('wk'))return;const n=V.l+1,a=S.dis[n]||(S.dis[n]=[]),k=t.dataset.k,i=a.indexOf(k);if(t.checked&&i>=0)a.splice(i,1);if(!t.checked&&i<0)a.push(k);save();wc()});
function bq(d,m,n){const all=pool(d,n),v=all.filter(w=>on(n,w)),
tw=([j,r,e])=>({k:'type',p:`Write in kana: <b>${e}</b>`,a:[...new Set([r,...all.filter(x=>x[2]==e).map(x=>x[1])])].join('|')}),
mw=([j,r,e])=>({k:'mc',p:`What does ${fu(j)} mean?`,a:e,o:sh([e,...sh(all.filter(x=>x[2]!=e)).slice(0,3).map(x=>x[2])])}),
lw=([j,r])=>({k:'listen',p:'Listen, then write what you hear in kana.',a:r,s:r.split('|')[0]}),
F=()=>d.q.map(x=>({k:'fill',p:x.s,a:x.a,en:x.en})),D=()=>d.q.map(x=>({k:'drop',p:x.s,a:x.a,en:x.en,o:sh(x.o)})),
R_=()=>(d.rd?d.rd.q:[]).map(x=>({k:'mc',p:x.p,a:x.a,o:sh(x.o),ctx:d.rd.j})),o={type:()=>v.map(tw),mc:()=>v.map(mw),listen:()=>v.map(lw),fill:F,drop:D,read:R_};
const q=sh(m=='mix'?[...v.map(w=>[tw,mw,lw][Math.random()*3|0](w)),...F().filter((_,i)=>i%2),...D().filter((_,i)=>!(i%2)),...R_()]:o[m]());
return S.cap>0?q.slice(0,S.cap):q}
function startQ(i,m){const q=bq(L[i],m,i+1);if(!q.length)return flash('No questions available. Check your word selection and limit.');Q={l:i,m,q,i:0,s:0,miss:[]};qn()}
const TY=['type','fill','listen'];
function qn(){const q=Q.q[Q.i];Q.d=0;Q.pick='';Q.kata=/^[ァ-ヶー]+$/.test(q.a.split('|')[0]);
let h=`<button onclick="render()">✕ Quit</button><p class="mu">Question ${Q.i+1} of ${Q.q.length}</p><div class="card">`;
if(q.ctx)h+=`<p class="jp">${fu(q.ctx)}</p><hr>`;
if(q.k=='listen')h+=`<p>${q.p}</p><button class="pri" data-s="${q.s}">▶ Play again</button>`;
else if(q.k=='fill'||q.k=='drop')h+=`<p class="jp big">${fu(q.p).replace('___','<span class="blank" id="bl"></span>')}</p><small>${q.en}</small>`;
else h+=`<p class="big">${q.p}</p>`;
if(q.k=='drop')h+=`<p>${q.o.map(v=>`<button class="chip" draggable="true" data-v="${v}">${v}</button>`).join('')}</p><p><small>Drag a word into the blank, or tap it.</small></p>`;
if(q.k=='mc')h+=q.o.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('');
if(TY.includes(q.k))h+=`<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${Q.kata?'type romaji → カタカナ':'type romaji → ひらがな'}">`;
h+=`<div id="pv" class="mu"></div></div><div class="fb" id="fb"></div>`+(q.k=='mc'?'':`<button class="pri" id="chk" onclick="ck()">Check</button>`);
app.innerHTML=shell(h);if($('#ans'))$('#ans').focus();if(q.k=='listen')setTimeout(()=>say(q.s),250)}
function ck(v){if(Q.d)return;const q=Q.q[Q.i];let g,ok;
if(TY.includes(q.k)){g=toKana($('#ans').value,1);if(Q.kata)g=kt(g);$('#ans').value=g;$('#pv').textContent='';ok=q.a.split('|').some(x=>nz(x)==nz(g)||(!/^[ァ-ヶー]+$/.test(x)&&hk(nz(x))==hk(nz(g))))}else{g=v!==undefined?v:Q.pick;if(!g)return;ok=g==q.a}
Q.d=1;if(ok)Q.s++;else Q.miss.push(q.a);
$('#fb').innerHTML=ok?'<span class="ok">✓ Correct</span>':`<span class="no">✗ Answer: ${q.a.split('|').join(' / ')}</span>`+(g?` <small>(you wrote: ${g})</small>`:'');
if($('#chk'))$('#chk').remove();$('#fb').insertAdjacentHTML('afterend',`<button class="pri" onclick="nx()">${Q.i+1<Q.q.length?'Next':'Finish'}</button>`)}
function nx(){Q.i++;Q.i<Q.q.length?qn():fin()}
function fin(){const p=Math.round(Q.s/Q.q.length*100),n=Q.l+1;S.sc[n]=Math.max(S.sc[n]||0,p);save();app.innerHTML=shell(`<div class="card"><h1>${p}%</h1><p>${Q.s} of ${Q.q.length} correct.</p>${Q.miss.length?`<p>Review: <span class="jp">${[...new Set(Q.miss)].join('、').replace(/\|/g,'/')}</span></p>`:''}<button class="pri" onclick="startQ(${Q.l},'${Q.m}')">Try again</button> <button onclick="V={l:${Q.l},tab:'test'};render()">Back to tests</button></div>`);Q=null}
const put=v=>{if(Q&&!Q.d&&$('#bl')){Q.pick=v;$('#bl').textContent=v}};
/* ---------- Events ---------- */
document.addEventListener('click',e=>{const t=e.target,k=t.closest('.k');
if(k){e.preventDefault();const c=k.dataset.k;S.off[c]=!S.off[c];document.querySelectorAll('.k').forEach(x=>x.dataset.k==c&&x.classList.toggle('off',!!S.off[c]));return save()}
const b=t.closest('[data-sel]');if(b)return sel(b.dataset.sel);const s=t.closest('[data-s]');if(s)return say(s.dataset.s);
const c=t.closest('.chip');if(c)return put(c.dataset.v);
const o=t.closest('.opt');if(o)ck(o.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id=='wf'){const q=e.target.value.toLowerCase();document.querySelectorAll('#wl label').forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none');return}if(e.target.id!='ans')return;let x=toKana(e.target.value);if(Q&&Q.kata)x=kt(x);e.target.value=x;let y=toKana(x,1);if(Q&&Q.kata)y=kt(y);$('#pv').textContent=y!=x?'→ '+y:''});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||!Q)return;if(Q.d)nx();else if(e.target.id=='ans')ck()});
document.addEventListener('dragstart',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v)e.dataTransfer.setData('text/plain',v)});
document.addEventListener('dragover',e=>{if(e.target.id=='bl')e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.id=='bl'){e.preventDefault();put(e.dataTransfer.getData('text/plain'))}});
/* ---------- Password gate ---------- */
function gate(){const h=HASH||localStorage.ph;app.innerHTML=`<div class="card" style="max-width:380px;margin:14vh auto"><h1>げんき</h1><p class="mu">${h?'Enter your password':'First visit: choose a password (6+ characters)'}</p><input id="pw" type="password" autocomplete="current-password"><p><button class="pri" id="go">${h?'Unlock':'Set password'}</button></p><p id="msg" class="no"></p></div>`;
const go=async()=>{const v=$('#pw').value,x=await sha(v);if(h){if(x!=h)return $('#msg').textContent='Wrong password.'}else{if(v.length<6)return $('#msg').textContent='Use at least 6 characters.';localStorage.ph=x;prompt('Copy this into HASH near the top of index.html and commit it, so every device uses this password:',x)}sessionStorage.ok=1;start()};
$('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key=='Enter')go()})}
async function start(){await pull();try{VX=await(await fetch('vocab.json')).json()}catch(e){}for(let i=0;i<23;i++){if(!L[i])L[i]={t:'',v:[],g:[],q:[],rd:null};const l=L[i],n=i+1;l.t=LT[i];if(i>6)l.g=(GX[n]||GT[n].split('|').map(h=>[h])).map(([h,b,j,e])=>({h,b:`<p>${b||'<span class="mu">Teaching notes for this section are still being written.</span>'}</p>`,x:j?[[j,e]]:[]}))}document.body.classList.toggle('nf',!S.furi);render()}
if(sessionStorage.ok)start();else gate();
</script></body></html>
